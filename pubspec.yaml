name: makon3d_mobile
description: "Makon 3D — LiDAR 3D room scanning app."
publish_to: 'none'

version: 1.0.0+12

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.6
  dio: ^5.10.0
  flutter_roomplan: ^1.0.7
  flutter_svg: ^2.2.0
  path_provider: ^2.1.4
  permission_handler: ^12.0.3
  share_plus: ^13.2.0
  room_scan_kit:
    git:
      url: https://github.com/uydoshtech/room_scan_kit.git
      ref: v0.6.11
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Match UyDosh: stay on CocoaPods. SPM fails on room_scan_kit because its
  # Package.swift has localized Resources but no defaultLocalization.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/branding/makon3d_logo.png
    - assets/branding/makon3d_logo.svg
    - assets/branding/makon3d_mark.svg
