name: Build & Release iOS TestFlight

on:
  push:
    tags:
      - "ios-*"
  workflow_dispatch:
    inputs:
      build_name:
        description: "Optional CFBundleShortVersionString (e.g. 1.0.0)"
        required: false
        default: ""
      build_number:
        description: "Optional CFBundleVersion (e.g. 2)"
        required: false
        default: ""

concurrency:
  group: release-testflight
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          # TAG examples: ios-1.0.0-2  (from pubspec version 1.0.0+2)

          VERSION_WITH_BUILD="${TAG#ios-}"
          VERSION_WITH_BUILD="${VERSION_WITH_BUILD#v}"

          if [[ "${VERSION_WITH_BUILD}" == *+* ]]; then
            BUILD_NAME="${VERSION_WITH_BUILD%%+*}"
            BUILD_NUMBER="${VERSION_WITH_BUILD##*+}"
          elif [[ "${VERSION_WITH_BUILD}" == *-* ]]; then
            BUILD_NUMBER="${VERSION_WITH_BUILD##*-}"
            BUILD_NAME="${VERSION_WITH_BUILD%-${BUILD_NUMBER}}"
          else
            echo "Could not parse build name/number from tag: ${TAG}"
            exit 1
          fi

          if [[ -z "${BUILD_NAME}" || -z "${BUILD_NUMBER}" || "${BUILD_NAME}" == "${BUILD_NUMBER}" ]]; then
            echo "Could not parse build name/number from tag: ${TAG}"
            exit 1
          fi

          echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"

          echo "Parsed BUILD_NAME=${BUILD_NAME} BUILD_NUMBER=${BUILD_NUMBER}"

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Show Xcode / SDK versions
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
          bundler: latest

      - name: Show bundled CocoaPods version
        run: |
          set -euo pipefail
          ruby -v
          gem --version
          bundle exec pod --version

      - name: Auth for private room_scan_kit dependency
        env:
          ROOM_SCAN_KIT_GITHUB_TOKEN: ${{ secrets.ROOM_SCAN_KIT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROOM_SCAN_KIT_GITHUB_TOKEN:-}" ]]; then
            echo "Missing repo secret ROOM_SCAN_KIT_GITHUB_TOKEN (read access to uydoshtech/room_scan_kit)."
            exit 1
          fi
          git config --global url."https://x-access-token:${ROOM_SCAN_KIT_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods deps
        run: |
          set -euo pipefail
          cd ios
          bundle exec pod install --repo-update

      - name: Install Distribution certificate and App Store profile
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_APPCLIP_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_APPCLIP_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${IOS_DIST_P12_BASE64:-}" ]]; then
            echo "Missing GitHub secret IOS_DIST_P12_BASE64 (base64 of Apple Distribution .p12)."
            exit 1
          fi
          if [[ -z "${IOS_DIST_P12_PASSWORD:-}" ]]; then
            echo "Missing GitHub secret IOS_DIST_P12_PASSWORD."
            exit 1
          fi
          if [[ -z "${IOS_APPCLIP_PROVISION_PROFILE_BASE64:-}" ]]; then
            echo "Missing GitHub secret IOS_APPCLIP_PROVISION_PROFILE_BASE64 (base64 of App Store .mobileprovision for com.makon3d.app.Clip)."
            echo "The App Clip is embedded in the Runner app, so its profile is required — see docs/APP_CLIP.md."
            exit 1
          fi

          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db || security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -s "${KEYCHAIN_PATH}"

          printf '%s' "${IOS_DIST_P12_BASE64}" | tr -d '\n\r ' | base64 -d > /tmp/ios_distribution.p12
          test -s /tmp/ios_distribution.p12

          # Must succeed — a wrong IOS_DIST_P12_PASSWORD used to be swallowed by `|| true`
          # and then surfaced later as "No signing certificate iOS Distribution found".
          security import /tmp/ios_distribution.p12 \
            -k "${KEYCHAIN_PATH}" \
            -P "${IOS_DIST_P12_PASSWORD}" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          echo "Codesigning identities after import:"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          if ! security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -q 'Apple Distribution'; then
            echo "ERROR: Apple Distribution identity not found after .p12 import."
            echo "Check IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD (wrong password is the usual cause)."
            exit 1
          fi

          # Regenerate the parent app's profile via the ASC API (needs the
          # distribution identity imported above, since sigh matches the
          # profile's certificate against the local keychain). Freshly
          # generated profiles pick up entitlements added to
          # Runner.entitlements (e.g. the App Clip association) that the
          # static IOS_PROVISION_PROFILE_BASE64 snapshot may predate.
          if [[ -n "${ASC_KEY_ID:-}" && -n "${ASC_ISSUER_ID:-}" && -n "${ASC_KEY_P8_BASE64:-}" ]]; then
            echo "Regenerating App Store profile via the ASC API..."
            bundle exec fastlane ios regen_app_profile
          fi

          if [[ -s /tmp/Makon3D_AppStore.mobileprovision ]]; then
            echo "Using App Store profile regenerated via the ASC API."
          elif [[ -n "${IOS_PROVISION_PROFILE_BASE64:-}" ]]; then
            printf '%s' "${IOS_PROVISION_PROFILE_BASE64}" | tr -d '\n\r ' | base64 -d > /tmp/Makon3D_AppStore.mobileprovision
          else
            echo "No regenerated profile and missing GitHub secret IOS_PROVISION_PROFILE_BASE64 (base64 of App Store .mobileprovision for com.makon3d.app)."
            echo "See tool/TESTFLIGHT_CI.md."
            exit 1
          fi
          test -s /tmp/Makon3D_AppStore.mobileprovision

          security cms -D -i /tmp/Makon3D_AppStore.mobileprovision > /tmp/embedded.mobileprovision.plist
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' /tmp/embedded.mobileprovision.plist)"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' /tmp/embedded.mobileprovision.plist)"

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/Makon3D_AppStore.mobileprovision \
            "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          # App Clip profile (com.makon3d.app.Clip) — the clip is embedded in
          # the Runner app, so archive + export need it too.
          printf '%s' "${IOS_APPCLIP_PROVISION_PROFILE_BASE64}" | tr -d '\n\r ' | base64 -d > /tmp/Makon3D_AppClip_AppStore.mobileprovision
          test -s /tmp/Makon3D_AppClip_AppStore.mobileprovision

          security cms -D -i /tmp/Makon3D_AppClip_AppStore.mobileprovision > /tmp/appclip.mobileprovision.plist
          APPCLIP_PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' /tmp/appclip.mobileprovision.plist)"
          APPCLIP_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' /tmp/appclip.mobileprovision.plist)"

          cp /tmp/Makon3D_AppClip_AppStore.mobileprovision \
            "${HOME}/Library/MobileDevice/Provisioning Profiles/${APPCLIP_PROFILE_UUID}.mobileprovision"

          PROFILE_NAME_ESC="$(printf '%s' "${PROFILE_NAME}" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"
          APPCLIP_PROFILE_NAME_ESC="$(printf '%s' "${APPCLIP_PROFILE_NAME}" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>method</key>'
            echo '  <string>app-store</string>'
            echo '  <key>signingStyle</key>'
            echo '  <string>manual</string>'
            echo '  <key>teamID</key>'
            echo '  <string>D5THR62Q33</string>'
            echo '  <key>signingCertificate</key>'
            echo '  <string>Apple Distribution</string>'
            echo '  <key>stripSwiftSymbols</key>'
            echo '  <true/>'
            echo '  <key>uploadBitcode</key>'
            echo '  <false/>'
            echo '  <key>compileBitcode</key>'
            echo '  <false/>'
            echo '  <key>destination</key>'
            echo '  <string>export</string>'
            echo '  <key>provisioningProfiles</key>'
            echo '  <dict>'
            echo '    <key>com.makon3d.app</key>'
            printf '    <string>%s</string>\n' "${PROFILE_NAME_ESC}"
            echo '    <key>com.makon3d.app.Clip</key>'
            printf '    <string>%s</string>\n' "${APPCLIP_PROFILE_NAME_ESC}"
            echo '  </dict>'
            echo '</dict>'
            echo '</plist>'
          } > ios/ExportOptions-ci.plist

          for cfg in ios/Flutter/Release.xcconfig ios/Flutter/Profile.xcconfig; do
            if [[ -f "${cfg}" ]]; then
              {
                echo ""
                echo "// --- CI signing overrides ---"
                echo "DEVELOPMENT_TEAM = D5THR62Q33"
                echo "CODE_SIGN_STYLE = Manual"
                echo "CODE_SIGN_IDENTITY = Apple Distribution"
                echo "PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}"
              } >> "${cfg}"
            fi
          done

          # The embedded App Clip target does not include Release.xcconfig, so
          # flip it to manual signing directly in the project.
          APPCLIP_PROFILE_NAME="${APPCLIP_PROFILE_NAME}" \
            bundle exec ruby ios/scripts/ci_appclip_signing.rb

          {
            echo "PROFILE_NAME=${PROFILE_NAME}"
            echo "PROFILE_UUID=${PROFILE_UUID}"
            echo "DEVELOPMENT_TEAM=D5THR62Q33"
            echo "CODE_SIGN_STYLE=Manual"
            echo "PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
          } >> "${GITHUB_ENV}"

          echo "Installed profile: ${PROFILE_NAME} (${PROFILE_UUID})"

      - name: Build IPA (Flutter)
        env:
          BUILD_NAME: ${{ inputs.build_name || env.BUILD_NAME }}
          BUILD_NUMBER: ${{ inputs.build_number || env.BUILD_NUMBER }}
          DEVELOPMENT_TEAM: D5THR62Q33
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
        run: |
          set -euo pipefail
          export PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME:?PROFILE_NAME missing}"

          if [[ -n "${BUILD_NAME:-}" && -n "${BUILD_NUMBER:-}" ]]; then
            bundle exec fastlane ios build_ipa build_name:"${BUILD_NAME}" build_number:"${BUILD_NUMBER}" export_options_plist:"ios/ExportOptions-ci.plist"
          elif [[ -n "${BUILD_NAME:-}" ]]; then
            bundle exec fastlane ios build_ipa build_name:"${BUILD_NAME}" export_options_plist:"ios/ExportOptions-ci.plist"
          elif [[ -n "${BUILD_NUMBER:-}" ]]; then
            bundle exec fastlane ios build_ipa build_number:"${BUILD_NUMBER}" export_options_plist:"ios/ExportOptions-ci.plist"
          else
            bundle exec fastlane ios build_ipa export_options_plist:"ios/ExportOptions-ci.plist"
          fi

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: makon3d-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          bundle exec fastlane ios upload_testflight
